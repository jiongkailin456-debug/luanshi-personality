<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>部署检查｜乱世人格志</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#F7F3EB;color:#24211E;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",Arial,sans-serif}.card{width:min(100% - 32px,480px);margin:40px auto;background:#FFFDF8;border:1px solid #DDD5C8;padding:28px 24px;box-shadow:0 12px 35px rgba(73,53,34,.05)}h1{font-size:25px;margin:0 0 4px}h2{font:normal 17px Georgia,serif;color:#8E2929;margin:0 0 22px}.row{border-top:1px solid #DDD5C8;padding:12px 0;overflow-wrap:anywhere}.row strong{display:block;font-size:13px;color:#77716A}.row span{display:block}a{color:#8E2929}p{font-size:13px;color:#77716A;margin:17px 0 0}
  </style>
</head>
<body>
  <main class="card">
    <h1>乱世人格志</h1>
    <h2>Deployment OK</h2>
    <div class="row"><strong>当前时间</strong><span id="check-time">检测中…</span></div>
    <div class="row"><strong>app.js</strong><span id="check-app">检测中…</span></div>
    <div class="row"><strong>localStorage</strong><span id="check-storage">检测中…</span></div>
    <div class="row"><strong>当前 hostname</strong><span id="check-host">检测中…</span></div>
    <p>仅显示部署状态，不读取测试答案或个人信息。</p>
    <p><a href="./">返回首页</a></p>
  </main>
  <script>
    document.getElementById('check-time').textContent = new Date().toLocaleString('zh-CN');
    document.getElementById('check-host').textContent = location.hostname || '本地文件';
    try {
      var key = 'luanshi-deployment-check';
      localStorage.setItem(key, 'ok');
      var works = localStorage.getItem(key) === 'ok';
      localStorage.removeItem(key);
      document.getElementById('check-storage').textContent = works ? '可用' : '不可用';
    } catch (_) { document.getElementById('check-storage').textContent = '不可用'; }
    if (location.protocol === 'file:') {
      document.getElementById('check-app').textContent = '本地文件模式无法检测，请部署后查看';
    } else {
      fetch('./app.js', { cache: 'no-store' }).then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      }).then(function (source) {
        document.getElementById('check-app').textContent = source.includes('const QUESTIONS') && source.includes('__LUANSHI_APP_READY__') ? '加载正常' : '响应内容异常';
      }).catch(function () { document.getElementById('check-app').textContent = '加载失败'; });
    }
  </script>
</body>
</html>
